name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de desarrollo (manifold-3d para las pruebas de separar)
        run: npm ci
      - name: Pruebas (Node, sin navegador)
        run: node --test
      - name: Tipos (tsc estricto, sin build)
        run: npx --yes -p typescript@6 tsc -p .
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: La interfaz de punta a punta (los controles cambian la extrusión y sigue encastrando)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e2e
          path: e2e-out/
